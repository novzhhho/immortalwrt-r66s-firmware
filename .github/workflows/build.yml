name: Firmware Build

# ─────────────────────────────────────────────────────────────────────────────
# ImmortalWrt (rockchip/armv8 · Lunzn FastRhino R66S) + lucky + bandix
#
# 触发：
#   · schedule          每日轮询上游版本，指纹不变则直接跳过（不耗构建额度）
#   · workflow_dispatch 手动触发，可强制重建、可临时改包清单
#
# 产物：Release（tag = 版本指纹），内含 sysupgrade 镜像 + 自定义 apk
# 刷机：路由器上执行 fwupdate
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 18 * * *"        # UTC 18:00 = 北京时间 02:00
  workflow_dispatch:
    inputs:
      force:
        description: "忽略已有 Release，强制重建"
        type: boolean
        default: false
      extra_packages:
        description: "额外包（空格分隔；留空用仓库内默认清单）"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: firmware-build
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  IW_TARGET: rockchip/armv8
  PROFILE: lunzn_fastrhino-r66s
  ARCH_PKGS: aarch64_generic
  ROOTFS_PARTSIZE: "4096"        # 必须与现网 4 GB rootfs 一致，否则 sysupgrade 会整盘重写

  LUCKY_FEED: https://github.com/gdy666/luci-app-lucky.git;main
  BANDIX_FEED: https://github.com/timsaya/openwrt-bandix.git;main
  BANDIX_LUCI_FEED: https://github.com/timsaya/luci-app-bandix.git;main

  # 由 SDK 统一打包的 6 个包（i18n 的具体命名随版本不同，构建时自动识别）
  CORE_PKGS: bandix luci-app-bandix lucky luci-app-lucky

  # 额外打进镜像的官方包（已用 ImmortalWrt 构建服务器校验过名字全部存在）
  DEFAULT_EXTRA: >-
    luci-app-openclash luci-theme-argon luci-app-argon-config luci-i18n-argon-config-zh-cn
    luci-app-cpufreq luci-i18n-cpufreq-zh-cn luci-i18n-base-zh-cn
    luci-app-package-manager luci-i18n-package-manager-zh-cn luci-app-commands
    luci-compat luci-lib-jsonc luci-lib-nixio luci-lib-ip luci-lua-runtime
    bash curl conntrack iw zoneinfo-all unzip usign
    block-mount automount kmod-usb-storage kmod-fs-ext4 kmod-fs-vfat
    kmod-fs-exfat kmod-fs-ntfs3 openssh-sftp-server ip-full fdisk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────── 1. 版本指纹 / 去重
      - name: Resolve upstream versions
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          raw=https://raw.githubusercontent.com

          IW=$(curl -fsSL --retry 3 https://downloads.immortalwrt.org/.versions.json | jq -r '.stable_version // empty')
          [ -n "$IW" ] || { echo "::error::取不到 ImmortalWrt 稳定版号"; exit 1; }

          # 三个插件版本一律取「feed 里打包 Makefile 的 PKG_VERSION」——
          # 上游 core 发版后 feed 的 Makefile 常常滞后，盯 Release 会误判。
          pkgver() {
            curl -fsSL --retry 3 "$1" | sed -n 's/^PKG_VERSION:=//p' | head -1 | tr -d ' \r'
          }
          LUCKY=$(pkgver "$raw/gdy666/luci-app-lucky/main/lucky/Makefile")
          BANDIX=$(pkgver "$raw/timsaya/openwrt-bandix/main/openwrt-bandix/Makefile")
          FRONT=$(pkgver "$raw/timsaya/luci-app-bandix/main/luci-app-bandix/Makefile")
          for v in "$LUCKY" "$BANDIX" "$FRONT"; do
            [ -n "$v" ] || { echo "::error::取不到插件版本号"; exit 1; }
          done

          TAG="r${IW}-lucky${LUCKY}-bandix${BANDIX}-luci${FRONT}"

          {
            echo "iw=$IW"
            echo "lucky=$LUCKY"
            echo "bandix=$BANDIX"
            echo "front=$FRONT"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 版本指纹"
            echo ""
            echo "| 组件 | 版本 |"
            echo "|---|---|"
            echo "| ImmortalWrt | \`$IW\` |"
            echo "| lucky | \`$LUCKY\` |"
            echo "| bandix | \`$BANDIX\` |"
            echo "| luci-app-bandix | \`$FRONT\` |"
            echo "| 产物 tag | \`$TAG\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "强制重建，忽略同名 Release"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG 已存在，跳过构建"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.ver.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install host deps
        if: steps.ver.outputs.build == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd jq python3-pyelftools \
            || sudo pip3 install --break-system-packages pyelftools
          # SDK 的全局 prereq 会检查 u-boot 等包，需要 elftools
          python3 -c "import elftools; print('pyelftools ok')"

      # ───────────────────────────────────────────── 2. 用 SDK 打 6 个自定义包
      # 三个上游（lucky / bandix / luci-app-bandix）的 Build/Compile 都是空的：
      # 它们只是「下载官方已编好的二进制 + 打包」。所以用 SDK 打一遍即可，
      # 不需要全量 buildroot。
      #
      # 注意：不能直接用上游 GitHub Release 里的 .apk —— bandix 上游发的是
      # ADB 格式包，与本版本 ImageBuilder 的 apk-tools 不兼容，装的时候会报
      # "package mentioned in index not found"。自己打一遍格式就统一了。
      - name: Build custom packages with SDK
        if: steps.ver.outputs.build == 'true'
        timeout-minutes: 45          # 正常 6~10 分钟；超了说明又混进了重量级依赖
        run: |
          set -euo pipefail
          IW="${{ steps.ver.outputs.iw }}"
          BASE="https://downloads.immortalwrt.org/releases/${IW}/targets/${IW_TARGET}"

          curl -fsSL --retry 3 "$BASE/sha256sums" -o /tmp/sums
          SDK=$(awk -F'[*[:space:]]' '{print $NF}' /tmp/sums \
                | grep -E '^immortalwrt-sdk-.*\.Linux-x86_64\.tar\.zst$' | head -1)
          [ -n "$SDK" ] || { echo "::error::sha256sums 里找不到 SDK"; exit 1; }
          echo "SDK = $SDK"

          curl -fL --retry 3 --retry-delay 5 -o /tmp/sdk.tar.zst "$BASE/$SDK"
          mkdir -p sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C sdk --strip-components=1

          cd sdk
          {
            echo "src-git lucky ${LUCKY_FEED}"
            echo "src-git bandix ${BANDIX_FEED}"
            echo "src-git bandix_luci ${BANDIX_LUCI_FEED}"
          } >> feeds.conf.default

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # ★ 关键补丁：bandix 的 Makefile 只为了拿 RUSTC_TARGET_ARCH（用来拼下载
          #   文件名）而 include 了 feeds/packages/lang/rust/rust-values.mk，
          #   这会让 rust/host 变成构建依赖，SDK 就开始从源码编 rustc —— 单这一步
          #   就要 1~2 小时，必然超时。而它的 Build/Compile 是空的（只下载官方
          #   预编译二进制再打包），根本不需要 rust。用等价定义替换掉那行 include。
          BM=feeds/bandix/openwrt-bandix/Makefile
          [ -f "$BM" ] || { echo "::error::找不到 $BM"; ls feeds/; exit 1; }
          sed -i 's|^include \$(TOPDIR)/feeds/packages/lang/rust/rust-values.mk|RUSTC_TARGET_ARCH:=$(ARCH)-unknown-linux-musl|' "$BM"
          # 只检查 include 行（Makefile 里还有一行注释也提到 rust-values.mk）
          if grep -qE '^[[:space:]]*include.*rust-values\.mk' "$BM"; then
            echo "::error::rust 依赖补丁未生效"; grep -n 'rust' "$BM"; exit 1
          fi
          grep -n 'RUSTC_TARGET_ARCH' "$BM"

          {
            echo 'CONFIG_PACKAGE_lucky=m'
            echo 'CONFIG_PACKAGE_luci-app-lucky=m'
            echo 'CONFIG_PACKAGE_bandix=m'
            echo 'CONFIG_PACKAGE_luci-app-bandix=m'
            # i18n 包名在不同版本下可能是 zh-cn / zh_Hans，全部打开，能选几个算几个
            echo 'CONFIG_PACKAGE_luci-i18n-lucky-zh-cn=m'
            echo 'CONFIG_PACKAGE_luci-i18n-lucky-zh_Hans=m'
            echo 'CONFIG_PACKAGE_luci-i18n-bandix-zh-cn=m'
            echo 'CONFIG_PACKAGE_luci-i18n-bandix-zh_Hans=m'
          } >> .config
          make defconfig

          echo "--- 选中的相关配置 ---"
          grep -E 'CONFIG_PACKAGE_(lucky|luci-app-lucky|bandix|luci-app-bandix|luci-i18n-lucky|luci-i18n-bandix)' .config || true

          # ★ 只编译这 4 个目录，绝不跑全局 make。
          #   SDK 的 defconfig 会顺带把 rust、rustdesk-server 之类上千个包选成 =m，
          #   全局 make 就会去源码编 rustc（1~2 小时，必超时）。按目录定点编译时，
          #   只会构建这 4 个包的依赖，rust 不会被碰。
          #   i18n 包（luci-i18n-*）定义在各自的 app Makefile 里，会一并产出。
          TARGETS="package/feeds/lucky/lucky
                   package/feeds/lucky/luci-app-lucky
                   package/feeds/bandix/openwrt-bandix
                   package/feeds/bandix_luci/luci-app-bandix"

          BUILD=""
          for t in $TARGETS; do
            [ -f "$t/Makefile" ] || { echo "::error::找不到 $t/Makefile"; ls package/feeds/ 2>/dev/null; exit 1; }
            BUILD="$BUILD $t/compile"
          done
          echo "编译目标:$BUILD"

          # shellcheck disable=SC2086
          make -j"$(nproc)" V=s $BUILD

          # 只挑我们要的那 6 个（其余依赖包不进镜像，避免和官方源版本打架）
          mkdir -p ../out-apk
          for pat in "bandix-*" "luci-app-bandix-*" "luci-i18n-bandix-*" \
                     "lucky-*" "luci-app-lucky-*" "luci-i18n-lucky-*"; do
            find bin/packages -name "${pat}.apk" -exec cp -v {} ../out-apk/ \; 2>/dev/null || true
          done
          echo "--- 产出的 apk ---"
          ls -l ../out-apk
          [ -n "$(ls -A ../out-apk)" ] || { echo "::error::SDK 没打出任何 apk"; exit 1; }

      # ──────────────────────────────────────── 3. ImageBuilder 组装完整镜像
      - name: Assemble image with ImageBuilder
        if: steps.ver.outputs.build == 'true'
        run: |
          set -euo pipefail
          IW="${{ steps.ver.outputs.iw }}"
          TAG="${{ steps.ver.outputs.tag }}"
          BASE="https://downloads.immortalwrt.org/releases/${IW}/targets/${IW_TARGET}"

          IB=$(awk -F'[*[:space:]]' '{print $NF}' /tmp/sums \
               | grep -E '^immortalwrt-imagebuilder-.*\.Linux-x86_64\.tar\.zst$' | head -1)
          [ -n "$IB" ] || { echo "::error::sha256sums 里找不到 ImageBuilder"; exit 1; }
          echo "ImageBuilder = $IB"

          curl -fL --retry 3 --retry-delay 5 -o /tmp/ib.tar.zst "$BASE/$IB"
          mkdir -p ib
          tar --zstd -xf /tmp/ib.tar.zst -C ib --strip-components=1

          cp -v out-apk/*.apk ib/packages/

          # 3.1 包名：4 个核心包写死，i18n 包从 _all.apk 反推（命名随版本变）
          CUSTOM="$CORE_PKGS"
          for f in out-apk/luci-i18n-*.apk; do
            [ -e "$f" ] || continue
            n=$(basename "$f" | sed -E 's/-[0-9][^-]*(-r[0-9]+)?_all\.apk$//')
            case " $CUSTOM " in *" $n "*) ;; *) CUSTOM="$CUSTOM $n" ;; esac
          done
          echo "自定义包清单: $CUSTOM"

          # 3.2 逐个确认文件都在，缺了立刻报错
          for p in $CORE_PKGS; do
            ls ib/packages/ | grep -qE "^${p}-[0-9]" \
              || { echo "::error::缺少必需包: $p"; ls -l ib/packages/; exit 1; }
            echo "  OK   $p"
          done

          # 3.3 版本号 / 仓库地址写进镜像，供路由器上的 fwupdate 使用
          mkdir -p files/etc
          echo "$TAG" > files/etc/fw-version
          echo "$GITHUB_REPOSITORY" > files/etc/fwupdate-repo
          chmod +x files/usr/bin/fwupdate

          EXTRA="${{ inputs.extra_packages }}"
          [ -n "$EXTRA" ] || EXTRA="$DEFAULT_EXTRA"

          # 3.4 组装。PACKAGES 是「追加」语义，默认包不会丢。
          cd ib
          make image \
            PROFILE="$PROFILE" \
            PACKAGES="$CUSTOM $EXTRA" \
            FILES="$GITHUB_WORKSPACE/files" \
            ROOTFS_PARTSIZE="$ROOTFS_PARTSIZE" \
            V=s -j"$(nproc)"

          echo "--- 产物 ---"
          ls -lh "bin/targets/${IW_TARGET}/"
          echo "IMGDIR=$(pwd)/bin/targets/${IW_TARGET}" >> "$GITHUB_ENV"

      # ───────────────────────────────────────────────────────── 4. 发 Release
      - name: Publish release
        if: steps.ver.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"

          IMG=$(ls "$IMGDIR"/*squashfs-sysupgrade.img 2>/dev/null | head -1 || true)
          if [ -z "$IMG" ]; then
            GZ=$(ls "$IMGDIR"/*squashfs-sysupgrade.img.gz 2>/dev/null | head -1 || true)
            if [ -n "$GZ" ]; then gunzip -c "$GZ" > /tmp/raw.img; IMG=/tmp/raw.img; fi
          fi
          [ -n "$IMG" ] || { echo "::error::ImageBuilder 没产出 sysupgrade 镜像"; ls -l "$IMGDIR"; exit 1; }

          mkdir -p /tmp/rel
          cp "$IMG" "/tmp/rel/r66s-${TAG}.img"
          gzip -9 "/tmp/rel/r66s-${TAG}.img"
          ( cd /tmp/rel && sha256sum "r66s-${TAG}.img.gz" > "r66s-${TAG}.img.gz.sha256" )

          cp out-apk/*.apk /tmp/rel/
          cp "$IMGDIR"/*.manifest /tmp/rel/ 2>/dev/null || true

          ls -lh /tmp/rel

          gh release create "$TAG" /tmp/rel/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "ImmortalWrt ${{ steps.ver.outputs.iw }} · Lunzn FastRhino R66S (rockchip/armv8)

          | 组件 | 版本 |
          |---|---|
          | ImmortalWrt | ${{ steps.ver.outputs.iw }} |
          | lucky | ${{ steps.ver.outputs.lucky }} |
          | bandix | ${{ steps.ver.outputs.bandix }} |
          | luci-app-bandix | ${{ steps.ver.outputs.front }} |

          **路由器上升级**

          \`\`\`sh
          fwupdate          # 检查 + 确认升级
          fwupdate -c       # 只检查
          \`\`\`

          **手动刷写**：下载 \`r66s-${TAG}.img.gz\` 后
          \`\`\`sh
          sysupgrade -v /tmp/r66s-${TAG}.img.gz
          \`\`\`"

      - name: Upload apks as artifact
        if: always() && steps.ver.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: custom-apks-${{ steps.ver.outputs.tag }}
          path: out-apk/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo ""
            echo "构建执行：\`${{ steps.ver.outputs.build }}\`"
            echo "版本：\`${{ steps.ver.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
